[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_GA_MEASUREMENT_ID,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_TURNSTILE_SITE_KEY"

[context.deploy-preview.environment]
  NEXT_PUBLIC_ROBOTS_INDEX = "false"

[context.branch-deploy.environment]
  NEXT_PUBLIC_ROBOTS_INDEX = "false"


[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_GA_MEASUREMENT_ID,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_TURNSTILE_SITE_KEY,NEXT_PUBLIC_STAGING_TURNSTILE_SITE_KEY"

[context.production.environment]
  SMKH_ENVIRONMENT = "production"
  SMKH_DEMO_MODE = "false"

[context.deploy-preview.environment]
  SMKH_ENVIRONMENT = "staging"
  SMKH_DEMO_MODE = "true"
  SMKH_ENABLE_STAGING_ANALYTICS = "false"
  SMKH_ENABLE_STAGING_EMAIL = "false"
  NEXT_PUBLIC_ROBOTS_INDEX = "false"

[context.branch-deploy.environment]
  SMKH_ENVIRONMENT = "staging"
  SMKH_DEMO_MODE = "true"
  SMKH_ENABLE_STAGING_ANALYTICS = "false"
  SMKH_ENABLE_STAGING_EMAIL = "false"
  NEXT_PUBLIC_ROBOTS_INDEX = "false"

